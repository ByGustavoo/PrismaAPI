logging:
  config: classpath:log4j2.xml

server:
  servlet:
    context-path: /PrismaAPI

prismaapi:
  cors:
    origens-permitidas: "http://localhost:5173"

spring:
  application:
    name: prismaapi

  config:
    import: "optional:classpath:META-INF/build-info.properties"

  servlet:
    encoding:
      charset: UTF-8
      force: true

  jpa:
    open-in-view: false

  flyway:
    enabled: true
    schemas: prisma
    default-schema: prisma
    baseline-on-migrate: true

  web:
    error:
      include-stacktrace: never

---

spring:
  config:
    activate:
      on-profile: dev

  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  port: 9017

prismaapi:
  cors:
    origens-permitidas: "http://localhost:[*],http://127.0.0.1:[*]"

---

spring:
  config:
    activate:
      on-profile: prod

server:
  port: 9027

---

spring:
  config:
    activate:
      on-profile: test

  flyway:
    locations: classpath:db/migration,classpath:db/test