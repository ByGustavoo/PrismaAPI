logging:
  config: classpath:log4j2.xml

server:
  servlet:
    context-path: /PrismaAPI

spring:
  application:
    name: prismaapi

  servlet:
    encoding:
      charset: UTF-8
      force: true

  jpa:
    open-in-view: false

  flyway:
    enabled: true
    schema: prismaapi
    baseline-on-migrate: true
    default-schema: prismaapi

  web:
    error:
      include-stacktrace: never

---

spring:
  config:
    activate:
      on-profile: dev

  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  port: 9017

---

spring:
  config:
    activate:
      on-profile: prod

server:
  port: 9027

---

spring:
  config:
    activate:
      on-profile: test
