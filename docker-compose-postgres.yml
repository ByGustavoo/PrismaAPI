services:
  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_DB: prisma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prismaAPI@2026
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    container_name: "Redis"
    image: "redis:alpine3.23"

    ports:
      - "6379:6379"

    restart: always

volumes:
  postgres-data: